<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsible AI Evidence Assistant</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #172033; line-height: 1.5; }
    h1 { line-height: 1.2; }
    textarea { box-sizing: border-box; width: 100%; min-height: 110px; padding: .75rem; font: inherit; border: 1px solid #8b98aa; border-radius: 6px; }
    textarea:focus, button:focus-visible { outline: 3px solid #86b7fe; outline-offset: 2px; }
    button { margin-top: .75rem; padding: .65rem 1rem; cursor: pointer; border: 1px solid #1e3a5f; border-radius: 6px; background: #1e3a5f; color: white; font: inherit; }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 1.5rem; }
    #answer, .evidence { margin-top: 1rem; padding: 1rem; background: #f3f6fb; border: 1px solid #d5deeb; border-radius: 8px; white-space: pre-wrap; }
    .muted { color: #526070; }
    .citation { font-family: ui-monospace, monospace; font-weight: 600; }
    .evidence > div + div { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #d5deeb; }
  </style>
</head>
<body>
  <h1>Responsible AI Evidence Assistant</h1>
  <p class="muted">Ask about the indexed demo governance documents. Answers are evidence-only unless an approved LLM endpoint is configured.</p>
  <label for="question">Question</label>
  <textarea id="question" placeholder="What belongs in an approval record?"></textarea>
  <button id="ask">Ask</button>
  <p id="status" class="muted" role="status" aria-live="polite"></p>
  <h2>Answer</h2>
  <div id="answer" role="status">No question asked yet.</div>
  <h2>Evidence</h2>
  <div id="evidence" class="evidence">Retrieved citations will appear here.</div>
  <script>
    const question = document.getElementById('question');
    const ask = document.getElementById('ask');
    const status = document.getElementById('status');
    const answer = document.getElementById('answer');
    const evidence = document.getElementById('evidence');
    let requestController = null;

    function renderEvidence(items) {
      evidence.replaceChildren();
      if (!items.length) {
        evidence.textContent = 'No matching evidence.';
        return;
      }
      items.forEach((item) => {
        const row = document.createElement('div');
        const citation = document.createElement('span');
        citation.className = 'citation';
        citation.textContent = item.citation;
        const metadata = item.source_metadata || {};
        const source = metadata.source || item.source;
        const chunkId = metadata.chunk_id || item.chunk_id;
        row.append(
          citation,
          document.createTextNode(` — ${source}#${chunkId} (score ${item.score})`),
        );
        if (item.snippet || item.text) {
          const excerpt = document.createElement('p');
          excerpt.textContent = item.snippet || item.text;
          row.append(excerpt);
        }
        evidence.append(row);
      });
    }

    async function submitQuestion() {
      const value = question.value.trim();
      if (value.length < 3) {
        status.textContent = 'Enter at least 3 characters.';
        question.focus();
        return;
      }
      answer.textContent = 'Retrieving evidence…';
      evidence.textContent = 'Retrieving evidence…';
      status.textContent = 'Retrieving evidence…';
      ask.disabled = true;
      requestController = new AbortController();
      const timeout = setTimeout(() => requestController.abort(), 15000);
      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: value, top_k: 3}),
          signal: requestController.signal,
        });
        let data;
        try {
          data = await response.json();
        } catch (_) {
          throw new Error(`Request failed (HTTP ${response.status}).`);
        }
        if (!response.ok) {
          const detail = typeof data.detail === 'string' ? data.detail : 'Request failed.';
          throw new Error(detail);
        }
        answer.textContent = [
          data.answer,
          '',
          `Mode: ${data.mode}`,
          `Fallback: ${data.fallback}`,
          `Evidence contract: ${data.evidence_contract}`,
          `Request: ${data.request_id}`,
          `Latency: ${data.latency_ms} ms`,
        ].join('\n');
        renderEvidence(Array.isArray(data.evidence) ? data.evidence : []);
        status.textContent = 'Complete.';
      } catch (error) {
        answer.textContent = 'No answer was returned.';
        evidence.textContent = 'Evidence is unavailable for this request.';
        status.textContent = error.name === 'AbortError'
          ? 'The request timed out. Try again.'
          : (error.message || 'The request could not be completed.');
      } finally {
        clearTimeout(timeout);
        requestController = null;
        ask.disabled = false;
      }
    }

    ask.addEventListener('click', submitQuestion);
    question.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') submitQuestion();
    });
  </script>
</body>
</html>
